name: Build Antigravity Arch ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system and install archiso
        run: |
          pacman -Syu --noconfirm archiso

      - name: Prepare custom profile
        run: |
          # Copy the official releng profile to our workspace to serve as the base
          cp -r /usr/share/archiso/configs/releng ./custom-profile
          
          # Inject our custom packages (append to the existing releng packages)
          cat packages.x86_64 >> ./custom-profile/packages.x86_64
          
          # Inject our automated installation script into the Live ISO's /root/ directory
          mkdir -p ./custom-profile/airootfs/root/
          cp install.sh ./custom-profile/airootfs/root/install.sh
          chmod +x ./custom-profile/airootfs/root/install.sh
          
          # Also copy the packages list so the install script can read it for pacstrap
          cp packages.x86_64 ./custom-profile/airootfs/root/packages.x86_64

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/work -o /tmp/out ./custom-profile/

      - name: Create GitHub Release (Fast CDN Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Antigravity Arch ISO (Latest)
          files: /tmp/out/*.iso
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
